services:
  # Nginx service for local development
  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80" # Map host port 80 to container port 80
    volumes:
      - ./nginx/default.dev.conf:/etc/nginx/conf.d/default.conf:ro # Mount dev Nginx config
      # No direct mounting of frontend/build here, Next.js service handles its own serving
    depends_on:
      - php-fpm
      - nextjs
    networks:
      - app-network

  # Next.js service for local development with hot-reloading
  nextjs:
    build:
      context: ../frontend
      dockerfile: Dockerfile.nextjs
    volumes:
      - ../frontend:/app # Mount frontend source code for hot-reloading
      - /app/node_modules # Anonymous volume for node_modules to prevent host interference
    ports:
      - "3000:3000" # Expose Next.js development port
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://nginx/api/v1 # API URL for frontend to use
    networks:
      - app-network
    command: npm run dev # Run Next.js in development mode

  # PHP-FPM service for local Laravel development
  php-fpm:
    build:
      context: .
      dockerfile: Dockerfile.php
    volumes:
      - ./app:/var/www/html # Mount Laravel application for live changes
    expose:
      - "9000"
    environment:
      DB_CONNECTION: pgsql # Keep this to specify the driver
      DATABASE_URL: postgresql://lab:lab1234@postgres:5432/orignxdb # UPDATED: Use database URL
      APP_KEY: ${APP_KEY}
      JWT_SECRET: ${JWT_SECRET}
      WEBHOOK_API_KEY: ${WEBHOOK_API_KEY:-your_secure_webhook_api_key_dev} # Separate webhook key for dev
      APP_DEBUG: true # Enable debug mode for Laravel
    depends_on:
      - postgres
    networks:
      - app-network

  # PostgreSQL database service for local development
  postgres:
    image: postgres:13-alpine
    environment:
      POSTGRES_DB: orignxdb # UPDATED: Database name from URL
      POSTGRES_USER: lab # UPDATED: Username from URL
      POSTGRES_PASSWORD: lab1234 # UPDATED: Password from URL
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data # Persistent data volume for dev
    ports:
      - "5432:5432" # UPDATED: Expose on default port 5432 for consistency with URL
    networks:
      - app-network

volumes:
  postgres_dev_data: # Define named volume for development PostgreSQL data

networks:
  app-network:
