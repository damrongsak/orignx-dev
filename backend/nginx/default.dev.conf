server {
    listen 80;
    server_name localhost; # For local development, use localhost

    # Proxy requests to the Next.js development server for the frontend
    location / {
        proxy_pass http://nextjs:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy API requests to Laravel PHP-FPM for /api/v1
    # This block will handle /api/v1/posts, /api/v1/login, /api/v1/webhook/posts etc.
    # It rewrites the path to remove '/v1' before sending to Laravel.
    location /api/v1 {
        rewrite ^/api/v1/(.*)$ /api/$1 break; # Rewrites /api/v1/posts to /api/posts
        proxy_pass http://php-fpm:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # If you had a specific Laravel route like Route::get('/blog', ...)
    # and wanted to access it via /api/v1/blog, the above rewrite handles it.
    # If you meant a new top-level API endpoint for 'blog' that is not 'posts',
    # you would define it in Laravel's routes/api.php, e.g.,
    # Route::get('/api/blog', function() { return 'Blog API endpoint'; });
    # The current Nginx setup would then rewrite /api/v1/blog to /api/blog.
}
