services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: orignx-app
    container_name: orignx_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=https://orignx.dev
    depends_on:
      - db
    networks:
      - orignx-network

  db:
    image: postgres:16
    container_name: orignx_db
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    networks:
      - orignx-network

networks:
  orignx-network:
    driver: bridge

volumes:
  pgdata: