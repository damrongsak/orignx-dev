services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: orignx-app:1.1.0
    container_name: orignx_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=https://www.orignx.dev

networks:
  orignx-network:
    driver: bridge
