services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: orignx-app
    container_name: orignx_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=https://orignx.dev
    env_file:
      - ./frontend/.env

networks:
  default:
    external:
      name: orignx_network